# CallStats: Apache configuration (installed to /etc/httpd/conf.d/callstats.conf)
# Only /opt/callstats/public is exposed; nothing else under /opt/callstats is mapped.

# Pages use relative URLs, so the address must end with a slash.
RedirectMatch 301 ^/callstats$ /callstats/

Alias /callstats /opt/callstats/public

<Directory /opt/callstats/public>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>
